<!-- Home page for the home painting estimator project. -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6f3">
    <title>Home Painting Estimator</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Segoe UI", sans-serif;
            color: #17231f;
            background: #f4f6f3;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
        }

        main {
            width: min(100% - 40px, 680px);
            padding: 48px 0;
        }

        p {
            color: #52615b;
            line-height: 1.6;
        }

        .eyebrow {
            color: #176b55;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 {
            max-width: 12ch;
            margin: 12px 0;
            font-size: 3.2rem;
            line-height: 1;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2.2rem;
            }
        }

        .status {
            margin-top: 32px;
            padding-top: 16px;
            border-top: 1px solid #cbd4ce;
            font-family: Consolas, monospace;
            font-size: 0.9rem;
        }

        .primary-link {
            min-height: 44px;
            margin-top: 16px;
            padding: 12px 16px;
            display: inline-flex;
            align-items: center;
            border-radius: 4px;
            background: #176b55;
            color: #ffffff;
            font-weight: 700;
            text-decoration: none;
        }

        .primary-link:focus-visible {
            outline: 3px solid #c65e48;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Code Crusaders · CSE326</p>
        <h1>Home painting, clearly estimated.</h1>
        <p>Choose your home size, paint finish and openings to see an itemized estimate.</p>
        <a class="primary-link" href="/estimator.html">Open painting estimator</a>
        <p class="status">Service status: running · API health: <a href="/api/health">/api/health</a></p>
    </main>
</body>
</html>
